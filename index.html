<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Love Box</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<style>
:root{--cream:#FFF9F4;--soft:#F8DDE5;--rose:#EFA7BC;--brown:#8B625B;--burg:#9D405C;--card:#fff;--ink:#5a3f3a;--bt:#9D405C;--bti:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--cream:#2b1e23;--card:#3a2830;--ink:#f7e6ea;--brown:#e6c2ba;--soft:#4b3039;--burg:#f2a0b8;--bt:#EFA7BC;--bti:#3b1a24}}
html,body{height:100%;margin:0}
*{box-sizing:border-box}
body{background:var(--cream);color:var(--ink);font:17px/1.6 'Mali',sans-serif;background-image:radial-gradient(var(--soft) 1.5px,transparent 1.5px);background-size:24px 24px;overflow-x:hidden;-webkit-tap-highlight-color:transparent;user-select:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--cream);z-index:5}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 18px 60px;max-width:480px;margin:0 auto}
.script{font-family:'Dancing Script',cursive;font-size:1.6rem;color:var(--burg);margin:0}
.hint{color:var(--brown);margin:6px 0 0;min-height:1.6em}
.box{position:relative;width:170px;height:150px;margin:44px auto 20px;border:0;background:none;cursor:pointer;padding:0}
.box:focus-visible{outline:3px solid var(--rose);outline-offset:8px;border-radius:12px}
.base{position:absolute;bottom:0;left:12px;right:12px;height:100px;background:var(--rose);border-radius:0 0 16px 16px;box-shadow:0 8px 18px rgba(139,98,91,.25)}
.base::after,.lid::after{content:"";position:absolute;left:50%;width:24px;transform:translateX(-50%);background:var(--cream);opacity:.85}
.base::after{top:0;bottom:0}
.lid{position:absolute;top:2px;left:0;right:0;height:50px;background:var(--burg);border-radius:12px;transform-origin:0 100%;transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
.lid::after{top:0;bottom:0}
.lid::before{content:"🎀";position:absolute;top:-26px;left:50%;transform:translateX(-50%);font-size:2rem;z-index:1}
.open .lid{transform:translateY(-46px) rotate(-16deg)}
.squish{animation:sq .28s}
@keyframes sq{30%{transform:scale(1.12,.88)}60%{transform:scale(.94,1.08)}}
.wob{animation:wob 2s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(0)}10%{transform:rotate(-5deg)}20%{transform:rotate(5deg)}30%{transform:rotate(0)}}
.msg{background:var(--card);border:1px solid var(--soft);border-radius:22px;padding:16px 20px;box-shadow:0 6px 16px rgba(139,98,91,.15);min-height:84px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;width:100%;animation:pop .35s}
@keyframes pop{from{transform:scale(.8) rotate(-2deg);opacity:0}}
.cnt{color:var(--brown);font-size:.9rem;margin-top:14px;min-height:1.4em}
.fl{position:fixed;pointer-events:none;font-size:1.6rem;z-index:20;animation:fl 1.1s ease-out forwards}
@keyframes fl{to{transform:translate(var(--dx),-130px) scale(1.4);opacity:0}}
.gear{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--card);color:var(--ink);border:1px solid var(--soft);border-radius:99px;padding:6px 14px;font:inherit;font-size:.9rem;cursor:pointer;z-index:6}
.ov{position:fixed;inset:0;background:rgba(60,30,40,.55);display:grid;place-items:center;z-index:30;padding:16px;user-select:text}
.md{background:var(--cream);border-radius:22px;padding:20px;width:min(440px,100%);max-height:88vh;overflow:auto;text-align:left}
.md label{display:block;margin-top:10px;font-weight:600}
input,textarea{width:100%;font:inherit;padding:8px 12px;border:1px solid var(--rose);border-radius:12px;background:var(--card);color:var(--ink)}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.btn{background:var(--bt);color:var(--bti);border:0;border-radius:99px;padding:8px 20px;font:inherit;cursor:pointer}
.btn.g{background:transparent;color:var(--burg);border:1px solid var(--rose)}
.err{color:#b3314f;font-size:.85rem;min-height:1.2em;margin:4px 0 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <p class="script" id="to"></p>
  <p class="hint" id="hint">มีของมาฝาก จิ้มกล่องดูซิ</p>
  <button class="box wob" id="box" aria-label="จิ้มเพื่อเปิดกล่อง"><div class="base"></div><div class="lid"></div></button>
  <div class="msg" id="msg" aria-live="polite" hidden></div>
  <p class="cnt" id="cnt"></p>
</main>
<button class="gear" id="gear">✏️ แก้ข้อความ</button>
<div id="root"></div>
<script>
const K='lovebox.lite.v1',$=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MSG=['เปิดมาก็เจอเรา ดีใจล่ะสิ ยอมรับมาเถอะ 😏','รักนะ แค่นี้แหละ ไม่ต้องซึ้ง 😌','วันนี้เหนื่อยก็พัก ไม่ไหวก็บอก เดี๋ยวเราเป็นแบตสำรองให้','เก่งแล้วนะ แม้ตอนที่คิดว่าไม่เก่งก็เก่งอยู่ดี','จิ้มอีกสิ ไม่มีใครห้าม แต่กล่องเริ่มเขินแล้ว','ถ้ามีใครทำให้หงุดหงิด บอกมา เดี๋ยวไปทำหน้าดุให้ (ดุไม่เป็นแต่จะพยายาม)','คิดถึงนะ ไม่ได้บอกบ่อย แต่คิดบ่อย','กินข้าวยัง ถ้ายังไปกินเลย กล่องรอได้','ใครน่ารักที่สุดในโลก… ก็คนที่กำลังจิ้มกล่องอยู่นี่แหละ','ทำไม่ไหวก็ไม่ต้องรีบ เราอยู่ข้างเธอทั้งตอนที่ไหวและไม่ไหว','ขอบคุณที่ทนกันมาถึงตอนนี้ 555','สู้ ๆ นะ ถ้าล้มก็ล้มมาทางนี้ แขนว่างอยู่','อย่าลืมดื่มน้ำ แล้วอย่าลืมรักเราด้วย 😚','เรื่องไม่ดีของวันนี้ ยัดใส่กล่องแล้วปิดฝาซะ','งอนได้ แต่ขอให้งอนน่ารัก ๆ นะ','{name} เก่งกว่าที่คิด และน่ารักกว่าที่ยอมรับ','จิ้มได้ไม่อั้น แต่คิดถึงตัวจริงก็ไม่ผิดกฎนะ'];
const MILE={10:'จิ้มครบ 10 แล้ว เก่งมาก รางวัลคือกอดหนึ่งที 🫂',25:'25 ครั้งแล้ว ว่างมากเลยนะเรา 555 ไปกินอะไรอร่อย ๆ กัน 🍜',50:'50 ครั้ง!! ขอบคุณที่ทนจิ้มจนสุดทาง รักนะ ♡'};
let S={name:'ที่รัก',msgs:MSG.join('\n')},n=0,opened=false,bag=[];
try{const d=JSON.parse(localStorage.getItem(K));if(d&&d.name&&d.msgs)S=d}catch(e){}
const list=()=>S.msgs.split('\n').map(x=>x.trim()).filter(Boolean);
function save(){try{localStorage.setItem(K,JSON.stringify(S));return true}catch(e){return false}}
function next(){if(!bag.length){bag=list().map((_,i)=>i).sort(()=>Math.random()-.5)}return list()[bag.pop()].replaceAll('{name}',S.name)}
function burst(x,y){const em=['♥','😘','💪','✨','🫶','😏','🍫'];for(let i=0;i<4;i++){const s=document.createElement('span');s.className='fl';s.textContent=em[Math.floor(Math.random()*em.length)];s.style.left=x-12+'px';s.style.top=y-12+'px';s.style.setProperty('--dx',(Math.random()*120-60)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),1200)}}
function head(){$('#to').textContent='ถึง '+S.name+' ♡'}
$('#box').addEventListener('click',e=>{const b=$('#box');b.classList.remove('wob','squish');void b.offsetWidth;b.classList.add('squish');n++;if(!opened){opened=true;b.classList.add('open');$('#hint').textContent='ว้าย เปิดแล้ว จิ้มต่อได้เรื่อย ๆ';$('#msg').hidden=false}
const m=$('#msg');m.style.animation='none';void m.offsetWidth;m.style.animation='';m.textContent=MILE[n]||next();$('#cnt').textContent='จิ้มไปแล้ว '+n+' ครั้ง';
const r=b.getBoundingClientRect();burst(e.clientX||r.left+r.width/2,e.clientY||r.top);try{navigator.vibrate&&navigator.vibrate(15)}catch(x){}});
function close(){$('#root').innerHTML=''}
$('#gear').onclick=()=>{$('#root').innerHTML=`<div class="ov"><form class="md" id="f" novalidate><h3 style="margin:0">แก้ข้อความ</h3><label>ชื่อคนรับ<input name="name" value="${esc(S.name)}" maxlength="30"></label><label>ข้อความในกล่อง (บรรทัดละข้อความ ใส่ {name} เพื่อแทรกชื่อ)<textarea name="msgs" rows="9">${esc(S.msgs)}</textarea></label><p class="err" id="err" role="alert"></p><p style="font-size:.8rem;margin:0">ข้อมูลเก็บไว้ในเบราว์เซอร์เครื่องนี้เท่านั้น</p><div class="row"><button type="button" class="btn g" id="rs">ใช้ข้อความเดิม</button><button type="button" class="btn g" id="cl">ยกเลิก</button><button class="btn">บันทึก</button></div></form></div>`;const f=$('#f');f.name.focus();$('#cl').onclick=close;$('#rs').onclick=()=>{f.msgs.value=MSG.join('\n')};
f.onsubmit=e=>{e.preventDefault();const nm=f.name.value.trim(),ms=f.msgs.value.trim();if(!nm||!ms){$('#err').textContent='กรอกชื่อและข้อความอย่างน้อย 1 บรรทัด';return}S={name:nm,msgs:ms};bag=[];if(!save()){$('#err').textContent='บันทึกไม่สำเร็จ เบราว์เซอร์ไม่อนุญาตให้เก็บข้อมูล';return}head();close()}};
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
head();
</script>
</body>
</html>
